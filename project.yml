# XcodeGen spec for Unroll.  Generate with:  xcodegen generate
name: Unroll
options:
  bundleIdPrefix: com.uranashel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Unroll:
    type: application
    platform: iOS
    sources:
      - path: Unroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uranashel.unroll
        INFOPLIST_FILE: Unroll/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  UnrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnrollTests
    dependencies:
      - target: Unroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unroll.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unroll"
        BUNDLE_LOADER: "$(TEST_HOST)"
  UnrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UnrollUITests
    dependencies:
      - target: Unroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Unroll
        PRODUCT_BUNDLE_IDENTIFIER: com.uranashel.unroll.uitests

schemes:
  Unroll:
    build:
      targets:
        Unroll: all
        UnrollTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Unroll/Resources/Unroll.storekit
    test:
      config: Debug
      targets: [UnrollTests]
  UnrollUI:
    build:
      targets:
        Unroll: all
        UnrollUITests: [test]
    test:
      config: Debug
      targets: [UnrollUITests]
